steps:
  # Keep the static files of the builds before this one (they are inside the image tagged :current),
  # so pages cached or left open across a deploy still find their JavaScript. Hashed names never clash.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -u
        mkdir -p web/.prev-static
        if docker pull us-central1-docker.pkg.dev/$PROJECT_ID/tropa/web:current >/dev/null 2>&1; then
          cid=$$(docker create us-central1-docker.pkg.dev/$PROJECT_ID/tropa/web:current)
          docker cp "$$cid:/srv/web/.next/static/." web/.prev-static/ && echo "kept $$(find web/.prev-static -type f | wc -l) earlier static files"
          docker container rm "$$cid" >/dev/null
          # files of builds older than 14 days are not kept: no page names them any more
          find web/.prev-static -type f -mtime +14 -print -delete | wc -l | xargs -I{} echo "dropped {} static files older than 14 days"
        else
          echo "no previous image: nothing to keep"
        fi
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'web/Dockerfile', '--build-arg', 'BUILD_TAG=$_TAG', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/tropa/web:$_TAG', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/tropa/web:current', '.']
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/tropa/web:$_TAG'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/tropa/web:current'
timeout: 1200s
